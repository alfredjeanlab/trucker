[package]
name = "trucker"
version = "1.0.1"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
description = "A rustc wrapper that shares compiled crates between worktrees on a machine"
repository = "https://github.com/alfredjeanlab/trucker"
readme = "README.md"
categories = ["development-tools::build-utils", "caching"]
keywords = ["cargo", "rustc", "cache", "worktree", "build"]
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-*"]

[dependencies]
blake3 = { version = "1", features = ["mmap"] }
memchr = "2"
memmap2 = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows needs its own system calls for clones, file identities, volumes and processes.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

# Unsafe code only in the system calls that clone a file, lease a library and ask a filesystem's size, and in the map of
# an output that is scanned, each allowed where it is written.
[lints.rust]
unsafe_code = "deny"

# A panic in a compiler wrapper fails the build it wraps, so errors are handled; tests may still unwrap.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
strip = true
lto = true
panic = "abort"
